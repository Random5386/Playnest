# Builds Playnest and runs the test suite on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is what Playnest runs on; Linux also runs the process tests (force stop) that need a real "game" process.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Playnest.sln -c Release

      - name: Test
        run: dotnet run --project tests/Playnest.Tests -c Release --no-build
